[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "linkedin-jobs-skill"
version = "0.1.0"
description = "Claude Code skill: LinkedIn job search that verifies postings, reveals pay, ranks by return on effort and remembers what you did. No login, no API key."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["claude-code", "claude-skill", "agent-skill", "linkedin", "jobs", "job-search", "ghost-jobs", "ats",
            "greenhouse", "lever", "ashby", "workday", "resume", "internships", "new-grad", "mcp"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business",
]
dependencies = [
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "lxml>=5",
  "pydantic>=2",
  "typer>=0.12",
  "tomli>=2; python_version < '3.11'",
]

[project.optional-dependencies]
pdf = ["pypdf>=4", "python-docx>=1"]
mcp = ["mcp>=1.2"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
lj = "linkedin_jobs.cli:app"

[project.urls]
Homepage = "https://github.com/advaithsarva/linkedin-jobs-skill"
Issues = "https://github.com/advaithsarva/linkedin-jobs-skill/issues"

[tool.hatch.build.targets.wheel]
packages = ["skills/linkedin-jobs/scripts/linkedin_jobs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits the real LinkedIn / ATS endpoints (run weekly in CI, skipped by default)"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 120
target-version = "py310"
